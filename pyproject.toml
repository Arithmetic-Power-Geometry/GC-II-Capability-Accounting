[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcii-capability-accounting"
version = "1.0.0"
description = "Reproducible whole-envelope capability attribution and interaction accounting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.3", "scikit-image>=0.22"]

[tool.setuptools.packages.find]
where = ["src"]
